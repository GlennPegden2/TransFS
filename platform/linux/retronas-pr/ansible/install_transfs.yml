---
- name: Install and configure TransFS for RetroNAS
  hosts: "{{ transfs_target_hosts | default('localhost') }}"
  become: true
  connection: "{{ transfs_connection | default('local') }}"

  vars:
    transfs_repo_url: https://github.com/GlennPegden2/TransFS.git
    transfs_repo_version: main
    transfs_install_root: /opt/transfs
    transfs_user: root
    transfs_group: root

    transfs_venv_path: "{{ transfs_install_root }}/.venv"
    transfs_python_bin: "{{ transfs_venv_path }}/bin/python"
    transfs_log_dir: /var/log/transfs
    transfs_installer_asset_roots:
      - /opt/retronas/transfs-retronas-installer/platform/linux
      - "{{ playbook_dir }}/../.."

    transfs_smb_mode: retronas_managed
    transfs_smb_preferred_port: 445
    transfs_smb_fallback_ports: 3445,1445,2445
    transfs_smb_strict_standard_port: false

    transfs_web_host: 0.0.0.0
    transfs_web_preferred_port: 8000
    transfs_web_fallback_ports: 8001,8080,18000
    transfs_web_strict_standard_port: false

    transfs_enable_port_auto_claim: true
    transfs_runtime_profile: retronas-baremetal

  tasks:
    - name: Install required packages
      ansible.builtin.package:
        name:
          - build-essential
          - git
          - libfuse3-dev
          - pkg-config
          - python3
          - python3-dev
          - python3-pip
          - python3-venv
          - fuse3
        state: present

    - name: Ensure FUSE mountpoint exists
      ansible.builtin.file:
        path: /mnt/transfs
        state: directory
        owner: root
        group: root
        mode: "0777"

    - name: Check for /dev/fuse device
      ansible.builtin.stat:
        path: /dev/fuse
      register: fuse_dev_stat

    - name: Fail if /dev/fuse is missing
      ansible.builtin.fail:
        msg: >-
          /dev/fuse is missing. This container/host cannot run FUSE filesystems.
          Please run with --device /dev/fuse --cap-add SYS_ADMIN and ensure FUSE is enabled.
      when: not fuse_dev_stat.stat.exists

    - name: Check for curl (for diagnostics)
      ansible.builtin.command: which curl
      register: curl_check
      changed_when: false
      failed_when: false

    - name: Install curl if missing
      ansible.builtin.package:
        name: curl
        state: present
      when: curl_check.rc != 0

    - name: Check for reachable postgres host
      ansible.builtin.command: ping -c 1 postgres
      register: pg_ping
      changed_when: false
      failed_when: false

    - name: Warn if postgres is not reachable
      ansible.builtin.debug:
        msg: >-
          WARNING: The postgres host is not reachable from this container. TransFS may fail to start.
      when: pg_ping.rc != 0

    - name: Ensure optional Samba packages are present when TransFS manages SMB
      ansible.builtin.package:
        name:
          - samba
        state: present
      when: transfs_smb_mode == 'transfs_managed'

    - name: Ensure TransFS install root exists
      ansible.builtin.file:
        path: "{{ transfs_install_root }}"
        state: directory
        owner: "{{ transfs_user }}"
        group: "{{ transfs_group }}"
        mode: "0755"

    - name: Checkout TransFS repository
      ansible.builtin.git:
        repo: "{{ transfs_repo_url }}"
        dest: "{{ transfs_install_root }}"
        version: "{{ transfs_repo_version }}"
        update: true

    - name: Install Python dependencies
      ansible.builtin.pip:
        requirements: "{{ transfs_install_root }}/requirements.txt"
        virtualenv: "{{ transfs_venv_path }}"
        virtualenv_command: python3 -m venv

    - name: Ensure TransFS platform helper directory exists
      ansible.builtin.file:
        path: "{{ transfs_install_root }}/platform/linux"
        state: directory
        owner: "{{ transfs_user }}"
        group: "{{ transfs_group }}"
        mode: "0755"

    - name: Probe bundled RetroNAS helper asset roots
      ansible.builtin.stat:
        path: "{{ item }}/configure_retronas.sh"
      loop: "{{ transfs_installer_asset_roots }}"
      register: transfs_installer_asset_root_checks

    - name: Select bundled RetroNAS helper asset root
      ansible.builtin.set_fact:
        transfs_installer_assets_root: >-
          {{
            (
              transfs_installer_asset_root_checks.results
              | selectattr('stat.exists')
              | map(attribute='item')
              | list
              | first
            )
            | default('')
          }}

    - name: Copy bundled RetroNAS helper scripts
      ansible.builtin.copy:
        src: "{{ transfs_installer_assets_root }}/{{ item }}"
        dest: "{{ transfs_install_root }}/platform/linux/{{ item }}"
        remote_src: true
        force: true
        owner: "{{ transfs_user }}"
        group: "{{ transfs_group }}"
        mode: "0755"
      loop:
        - configure_retronas.sh
        - start_transfs_retronas.sh
        - transfs_retronas_ctl.sh
      when: transfs_installer_assets_root | length > 0

    - name: Check RetroNAS runtime helper scripts
      ansible.builtin.stat:
        path: "{{ transfs_install_root }}/platform/linux/{{ item }}"
      loop:
        - configure_retronas.sh
        - start_transfs_retronas.sh
        - transfs_retronas_ctl.sh
      register: transfs_runtime_helper_stats

    - name: Fail when RetroNAS runtime helper scripts are unavailable
      ansible.builtin.fail:
        msg: >-
          Required RetroNAS helper script is missing: {{ item.item }}.
          Expected it either in the checked out TransFS repo under
          {{ transfs_install_root }}/platform/linux or in one of the bundled asset roots:
          {{ transfs_installer_asset_roots | join(', ') }}.
      loop: "{{ transfs_runtime_helper_stats.results }}"
      when: not item.stat.exists

    - name: Ensure log directory exists
      ansible.builtin.file:
        path: "{{ transfs_log_dir }}"
        state: directory
        owner: "{{ transfs_user }}"
        group: "{{ transfs_group }}"
        mode: "0755"

    - name: Deploy runtime environment file
      ansible.builtin.template:
        src: templates/transfs-retronas.env.j2
        dest: /etc/default/transfs-retronas
        owner: root
        group: root
        mode: "0644"
      notify: Restart transfs-retronas

    - name: Ensure runtime scripts are executable
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0755"
      loop:
        - "{{ transfs_install_root }}/platform/linux/configure_retronas.sh"
        - "{{ transfs_install_root }}/platform/linux/start_transfs_retronas.sh"
        - "{{ transfs_install_root }}/platform/linux/transfs_retronas_ctl.sh"

    - name: Apply RetroNAS config profile
      ansible.builtin.command: "{{ transfs_install_root }}/platform/linux/configure_retronas.sh"
      environment:
        TRANSFS_APP_DIR: "{{ transfs_install_root }}/app"
        TRANSFS_CONFIG_PATH: "{{ transfs_install_root }}/app/config/app.yaml"
        TRANSFS_SMB_MODE: "{{ transfs_smb_mode }}"
        TRANSFS_SMB_PREFERRED_PORT: "{{ transfs_smb_preferred_port | string }}"
        TRANSFS_SMB_FALLBACK_PORTS: "{{ transfs_smb_fallback_ports }}"
        TRANSFS_SMB_STRICT_STANDARD_PORT: "{{ transfs_smb_strict_standard_port | ternary('true', 'false') }}"
        TRANSFS_WEB_HOST: "{{ transfs_web_host }}"
        TRANSFS_WEB_PREFERRED_PORT: "{{ transfs_web_preferred_port | string }}"
        TRANSFS_WEB_FALLBACK_PORTS: "{{ transfs_web_fallback_ports }}"
        TRANSFS_WEB_STRICT_STANDARD_PORT: "{{ transfs_web_strict_standard_port | ternary('true', 'false') }}"
        TRANSFS_ENABLE_PORT_AUTO_CLAIM: "{{ transfs_enable_port_auto_claim | ternary('true', 'false') }}"
        TRANSFS_RUNTIME_PROFILE: "{{ transfs_runtime_profile }}"
      changed_when: true
      notify: Restart transfs-retronas

    - name: Check for systemctl availability
      ansible.builtin.command: systemctl --version
      register: transfs_systemctl_check
      changed_when: false
      failed_when: false

    - name: Deploy systemd unit
      ansible.builtin.template:
        src: templates/transfs-retronas.service.j2
        dest: /etc/systemd/system/transfs-retronas.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload and restart transfs-retronas
      when: transfs_systemctl_check.rc == 0

    - name: Enable and start TransFS service
      ansible.builtin.systemd:
        name: transfs-retronas.service
        enabled: true
        state: started
      when: transfs_systemctl_check.rc == 0

    - name: Start TransFS runtime without systemd
      ansible.builtin.command: "{{ transfs_install_root }}/platform/linux/transfs_retronas_ctl.sh start"
      register: transfs_portable_runtime_start
      changed_when: "'Started TransFS with PID' in transfs_portable_runtime_start.stdout"
      when: transfs_systemctl_check.rc != 0

    - name: Report portable runtime activation in non-systemd environments
      ansible.builtin.debug:
        msg: >-
          systemctl is not available in this environment, so TransFS was started via
          {{ transfs_install_root }}/platform/linux/transfs_retronas_ctl.sh.
          This is expected in the RetroNAS Docker testbed container.
      when: transfs_systemctl_check.rc != 0

  handlers:
    - name: Restart transfs-retronas via systemd
      listen: Restart transfs-retronas
      ansible.builtin.systemd:
        name: transfs-retronas.service
        state: restarted
      when: transfs_systemctl_check.rc == 0

    - name: Restart transfs-retronas via portable launcher
      listen: Restart transfs-retronas
      ansible.builtin.command: "{{ transfs_install_root }}/platform/linux/transfs_retronas_ctl.sh restart"
      when: transfs_systemctl_check.rc != 0

    - name: Reload and restart transfs-retronas via systemd
      listen: Reload and restart transfs-retronas
      ansible.builtin.systemd:
        daemon_reload: true
        name: transfs-retronas.service
        state: restarted
      when: transfs_systemctl_check.rc == 0

    - name: Reload and restart transfs-retronas via portable launcher
      listen: Reload and restart transfs-retronas
      ansible.builtin.command: "{{ transfs_install_root }}/platform/linux/transfs_retronas_ctl.sh restart"
      when: transfs_systemctl_check.rc != 0
