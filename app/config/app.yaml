cache:
  # PKL file caches: PERMANENTLY DISABLED
  # Reason: PKL caches persist stale data across container restarts and config changes.
  # When config changes (e.g., adding PO to filetypes), old cached entries remain invalid.
  # Only in-memory session caches are now used (cleared on every restart, preventing staleness).
  # Persistent metadata is retrieved from the database when database.enabled=true.
  dir_cache_enabled: false  # Disabled - in-memory session cache only
  dir_listing_cache_enabled: false  # Disabled - in-memory session cache only
  getattr_cache_enabled: false  # Disabled - in-memory session cache only
  getattr_cache_save_interval: 5.0
  force_pkl_caches: false  # Force PKL caches off - they cause staleness issues
  
  # In-memory caches (always enabled, session-scoped, no staleness risk)
  readdir_direntry_cache_enabled: true
  readdir_skip_cache_lookup_with_direntry: true
  transform_output_size_cache_enabled: true
  transform_pipeline_cache_enabled: true
cache_warmer:
  batch_size: 10
  check_interval_seconds: 5
  cpu_threshold_percent: 20.0
  enabled: false
  io_threshold_percent: 20.0
  max_depth: 12
database:
  auto_sync: true
  enabled: false
  mode: hybrid
  sync_on_startup: true
  path: /mnt/filestorefs/.transfs_metadata.db
filestore: /mnt/filestorefs
mountpoint: /mnt/transfs
ssl_ignore_hosts:
- arcarc.nl
- releases.prodos8.com
ui:
  advanced_options: true
  show_real_path_tooltips: true
web_api:
  host: ''
  port: 8000
zaparoo:
  clients:
  - enabled: true
    host: 192.168.95.78
    mount_path: /media/fat/cifs
    name: MiSTer
    port: 7497
