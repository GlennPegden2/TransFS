# MiSTer Client Configuration — generated from RetroNAS install_mister_cifs.yml
# Generated by tools/import_mister_cifs.py
# This config is part of the 'retronas' config set and reflects the
# directory structure created by the RetroNAS install_mister_cifs.yml Ansible playbook.
#
# Do not hand-edit — re-run the importer to refresh after RetroNAS changes.

name: MiSTer
download_layout: folder_based
default_target_path: '{name}/{system_name}/{maps}'
retronas_support:
  enabled: true
  transport: smb
  auto_map_system_name: true
  canonical_roots:
    roms: '{filestore}/Native/roms/{src}'
    saves: '{filestore}/Native/saves/{src}'
    savestates: '{filestore}/Native/savestates/{src}'
    bios: '{filestore}/Native/bios/{src}'
    wallpapers: '{filestore}/Native/wallpapers/{src}'
  top_levels:
  - name: games
    source_root: roms
    per_system: true
  - name: saves
    source_root: saves
    per_system: true
  - name: savestates
    source_root: savestates
    per_system: true
  - name: BIOS
    source_root: bios
    per_system: true
  - name: wallpapers
    source_root: wallpapers
    per_system: false
  overrides:
  - top_level: saves
    client_name: GAMEBOY2P
    src: nintendo/gameboy2p
  - top_level: savestates
    client_name: GAMEBOY2P
    src: nintendo/gameboy2p
  - top_level: saves
    client_name: GBA2P
    src: nintendo/gameboyadvance2p
  - top_level: savestates
    client_name: GBA2P
    src: nintendo/gameboyadvance2p
