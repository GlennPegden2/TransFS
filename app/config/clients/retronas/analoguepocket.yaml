# Analogue Pocket Client Configuration — generated from RetroNAS install_analoguepocket_cifs.yml
# Generated by tools/import_mister_cifs.py
# This config is part of the 'retronas' config set and reflects the
# directory structure created by the RetroNAS install_analoguepocket_cifs.yml Ansible playbook.
#
# Do not hand-edit — re-run the importer to refresh after RetroNAS changes.

name: Analogue Pocket
download_layout: folder_based
default_target_path: '{name}/{system_name}/{maps}'
retronas_support:
  enabled: true
  transport: smb
  auto_map_system_name: true
  canonical_roots:
    roms: '{filestore}/Native/roms/{src}'
    cores: '{filestore}/Native/cores/{src}'
    platforms: '{filestore}/Native/platforms/{src}'
    presets: '{filestore}/Native/presets/{src}'
    saves: '{filestore}/Native/saves/{src}'
  top_levels:
  - name: Assets
    source_root: roms
    per_system: true
  - name: Cores
    source_root: cores
    per_system: false
  - name: Platforms
    source_root: platforms
    per_system: false
  - name: Presets
    source_root: presets
    per_system: false
  - name: Saves
    source_root: saves
    per_system: false
