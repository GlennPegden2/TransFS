# Batocera Client Configuration — generated from RetroNAS install_batocera_cifs.yml
# Generated by tools/import_mister_cifs.py
# This config is part of the 'retronas' config set and reflects the
# directory structure created by the RetroNAS install_batocera_cifs.yml Ansible playbook.
#
# Do not hand-edit — re-run the importer to refresh after RetroNAS changes.

name: Batocera
download_layout: folder_based
default_target_path: '{name}/{system_name}/{maps}'
retronas_support:
  enabled: true
  transport: smb
  auto_map_system_name: true
  canonical_roots:
    roms: '{filestore}/Native/roms/{src}'
    saves: '{filestore}/Native/saves/{src}'
    bios: '{filestore}/Native/bios/{src}'
  top_levels:
  - name: ROMS
    source_root: roms
    per_system: true
  - name: SAVES
    source_root: saves
    per_system: true
  - name: BIOS
    source_root: bios
    per_system: true
