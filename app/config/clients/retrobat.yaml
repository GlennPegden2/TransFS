# RetroBat Client Configuration
# Defines system mappings and file organization for RetroBat frontend

name: RetroBat
default_target_path: "{name}/{system_name}/roms/Atom/{maps}"

systems: 
  - name: AcornAtom
    manufacturer: Acorn
    system_mapping_name: Atom
    local_base_path: Acorn/Atom
    maps:
      - bios/atom.zip:
          file:
            path: BIOS/atom.zip
      - HDs:
          query:
            source_dir: Software
            extensions:
              - VHD
            supports_zip: false
            supports_zaparoo: true


