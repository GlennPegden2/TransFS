# RetroBat Client Configuration
# Defines system mappings and file organization for RetroBat frontend

name: RetroBat
download_layout: source_based
default_target_path: "{name}/{system_name}/roms/Atom/{maps}"

systems: 
  - name: AcornAtom
    manufacturer: Acorn
    system_mapping_name: Atom
    local_base_path: Acorn/Atom
    maps:
      - bios/atom.zip:
          file:
            path: BIOS/atom.zip
      - HDs:
          query:
            source_dir: Software
            extensions:
              - VHD
            supports_zip: false
            supports_zaparoo: true
      - FDs:
          query:
            source_dir: Software
            extensions:
              - ATM
            supports_zip: false
            supports_zaparoo: false
            preserve_exact_filenames: true
            preserve_structure: false  # Set to true to keep AA/, AGD/ subdirectories instead of flattening
      

