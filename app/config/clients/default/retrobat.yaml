# RetroBat Client Configuration
# Defines system mappings and file organization for RetroBat frontend

name: RetroBat
download_layout: source_based
default_target_path: "{name}/{system_name}/{maps}"

# Client-level base path for client infrastructure files (e.g., downloaded BIOS)
local_base_path: Clients/RetroBat

# Category-based path templates
# Maps with category="roms" will appear under ROMS/{system_name}
# Maps with category="bios" will appear under bios/{system_name}
# Maps with category="shared_bios" will appear under bios (no system subdirectory)
category_paths:
  roms: "{name}/ROMS/{system_name}"
  bios: "{name}/bios/{system_name}"
  mame_roms: "{name}/mame/roms/{system_name}"
  mame_bios: "{name}/mame/bios/{system_name}"
  shared_bios: "{name}/bios"  # Shared BIOS folder at client root

# Client-level maps (apply globally to all systems in this client)
# These files appear at /RetroBat/bios/* regardless of system
maps:
  - .:  # All files from Clients/RetroBat/bios/ (downloaded BIOS files)
      category: shared_bios
      query:
        source_dir: bios
        extensions:
          - "*"
        preserve_structure: true
        supports_zaparoo: false
        preserve_exact_filenames: true
  - .:  # Pre-packaged BIOS collection from retrobat-bios repo
      category: shared_bios
      query:
        source_dir: ../Systems/Acorn/Atom/Software/BIOS/retrobat-bios-main
        extensions:
          - "*"
        preserve_structure: true
        supports_zaparoo: false
        preserve_exact_filenames: false

systems: 
  - name: AcornAtom
    manufacturer: Acorn
    system_mapping_name: Atom
    local_base_path: Acorn/Atom
    maps:
      - FDs:
          category: roms  # Appears at /RetroBat/ROMS/AcornAtom/FDs
          query:
            source_dir: Software/Sources
            extensions:
#              - ATM
              - DSK
            supports_zip: true
            supports_zaparoo: false
            preserve_exact_filenames: true
      - ROMs:
          category: roms  # Appears at /RetroBat/ROMS/AcornAtom/ROMs
          query:
            source_dir: Software/Sources
            extensions:
              - ROM
            supports_zip: true
            supports_zaparoo: false
            preserve_exact_filenames: true
      - Tapes:
          category: roms  # Appears at /RetroBat/ROMS/AcornAtom/Tapes
          query:
            source_dir: Software/Sources
            extensions:
              - UEF
            supports_zip: true
            supports_zaparoo: false
            preserve_exact_filenames: true
#            preserve_structure: true  # Enable to see directory structure: FDs/Sources/hoglet67/AA/...
      - atom.zip:
          category: shared_bios  # Appears at /RetroBat/bios/atom.zip (shared root, not system-specific)
          file:
            path: Software/BIOS/atom.zip
            zip_mode: file  # Treat as a file, not a browsable directory


