# RomM Client Configuration
# Defines system mappings for RomM ROM manager (https://github.com/rommapp/romm)
#
# RomM expects "Structure A" folder layout:
#   roms/{platform_slug}/   <- game files
#   bios/{platform_slug}/   <- BIOS files (optional)
#
# Platform slugs are case-sensitive RomM identifiers (e.g. "psx", "n64", "gba").
# See: https://docs.romm.app/latest/Platforms-and-Players/Supported-Platforms/
#
# Usage:
#   Mount the TransFS virtual path "RomM/" as the RomM library root.
#   RomM will auto-detect platforms by folder name under roms/.

name: RomM
download_layout: folder_based
default_target_path: "{name}/{system_name}/{maps}"

# Category-based path templates
# roms/{slug}/  = game files   (mount RomM/ as library root)
# bios/{slug}/  = BIOS files   (optional, for platforms that need them)
category_paths:
  roms: "{name}/roms/{system_name}"
  bios: "{name}/bios/{system_name}"

systems:

  # ---------------------------------------------------------------------------
  # 3DO Company
  # ---------------------------------------------------------------------------
  - name: 3do
    display_name: "3DO Interactive Multiplayer"
    manufacturer: 3DO
    system_mapping_name: 3DO
    local_base_path: Systems/3DO/3DO
    maps:
      - .:
          category: roms
          query:
            source_dir: Software/Collections
            extensions:
              - CHD
              - CUE
              - BIN
              - ISO
            transform_zip: false
            supports_zaparoo: true

