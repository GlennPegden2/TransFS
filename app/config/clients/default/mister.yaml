  # --- Apple ---
  - name: Apple-I
    display_name: "Apple I"
    manufacturer: Apple
    system_mapping_name: AppleI
    local_base_path: Apple/AppleI
    maps:
      - Tapes:
          query:
            source_dir: Software
            extensions:
              - CAS
            transform_zip: false
            supports_zaparoo: true
  - name: Apple-II
    display_name: "Apple //e"
    manufacturer: Apple
    system_mapping_name: AppleII
    local_base_path: Apple/AppleII
    maps:
      - FDs:
          query:
            source_dir: Software
            extensions:
              - DSK
              - DO
              - PO
              - 2MG
            extension_filters:
              2MG:
                max_size: 908288  # 865KB + 64KB header + 1 byte
            transform_zip: false
            supports_zaparoo: true
          transforms:
            2MG:
              - type: two_mg
      - HDs:
          query:
            source_dir: Software
            extensions:
              - HDV
              - 2MG
            extension_filters:
              2MG:
                min_size: 908289  # 865KB + 64KB header + 2 bytes (exclusive lower bound)
            transform_zip: false
            supports_zaparoo: true
          transforms:
            2MG:
              - type: two_mg
                output_extension: hdv  # Large 2MG files in HDs should appear as .hdv

