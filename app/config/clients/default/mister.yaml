# MiSTer FPGA Client Configuration
# Defines system mappings and file organization for MiSTer platform

name: MiSTer
download_layout: folder_based
default_target_path: "{name}/{system_name}/{maps}"

retronas_support:
  enabled: false
  transport: smb
  auto_map_system_name: true
  canonical_roots:
    roms: "Canonical/roms/{src}"
    saves: "Canonical/saves/{src}"
    savestates: "Canonical/savestates/{src}"
    bios: "Canonical/bios/{src}"
  top_levels:
    - name: games
      source_root: roms
      per_system: true
    - name: saves
      source_root: saves
      per_system: true
    - name: savestates
      source_root: savestates
      per_system: true
    - name: BIOS
      source_root: bios
      per_system: true
  overrides:
    - top_level: games
      client_name: PSX
      src: sony/playstation1
    - top_level: saves
      client_name: PSX
      src: sony/playstation1
    - top_level: savestates
      client_name: PSX
      src: sony/playstation1
    - top_level: BIOS
      client_name: PSX
      src: sony/playstation1
    - top_level: games
      client_name: PlayStation
      src: sony/playstation1

systems:
 # --- 3DO Company ---
  - name: 3do
    manufacturer: 3DO
    system_mapping_name: 3DO
    local_base_path: Systems/3DO/3DO
    maps:
      - boot.rom:
          file:
            path: BIOS/3do.zip
            zip_internal_file: panafz1.bin 
            unzip: true
            supports_zaparoo: false
      - cd_bios.rom:
          file:
            path: BIOS/3do.zip
            zip_internal_file: panafz1.bin 
            unzip: true
            supports_zaparoo: false
      - panafz10.bin:
          file:
            path: BIOS/3do.zip
            zip_internal_file: panafz1.bin 
            unzip: true
            supports_zaparoo: false
      - CDs:
          query:
            source_dir: Software/Collections/
            extensions:
              - CUE
              - BIN
              - CHD
              - ISO
            transform_zip: true
            zip_mode: flatten
            supports_zaparoo: true
      - BIOS:
          query:
            source_dir: BIOS
            extensions:
              - ROM
              - BIN
              - ZIP

  # --- Acorn ---
  - name: AcornAtom
    manufacturer: Acorn
    system_mapping_name: Atom
    local_base_path: Acorn/Atom
    maps:
      - boot.vhd:
          file:
            path: Software/VHD/hoglet67.vhd
            supports_zaparoo: true
      - HDs:
          query:
            source_dir: Software
            extensions:
              - VHD
            transform_zip: false
            supports_zaparoo: true
  - name: Archie
    manufacturer: Acorn
    system_mapping_name: Archimedes
    local_base_path: Acorn/Archimedes
    maps:
      - riscos.rom:
          file:
            path: BIOS/riscos.rom
      - riscos3_71.rom:
          file:
            path: BIOS/riscos3_71.rom
      - FDs:
          query:
            source_dir: Software
            extensions:
              - ADF
            transform_zip: false
            supports_zaparoo: false
      - HDs:
          query:
            source_dir: Software
            extensions:
              - HDF
            transform_zip: false
            supports_zaparoo: false
  - name: AcornElectron
    manufacturer: Acorn
    system_mapping_name: Electron
    local_base_path: Acorn/Electron/
    maps:
      - boot.vhd:
          file:
            path: Software/MMB/ElkBEEB.zip
            unzip: true
            zip_internal_file: BEEB.MMB
            supports_zaparoo: true
      - FDs:
          query:
            source_dir: Software
            extensions:
              - ADF
              - DFS
              - HFE
              - SSD
            transform_zip: true
            supports_zaparoo: true
            zip_mode: flatten
      - HDs:
          query:
            source_dir: Software
            extensions:
              - MMB
              - VHD
            extension_map:
              MMB: VHD
            transform_zip: true
            supports_zaparoo: true
            zip_mode: flatten
      - Tapes:
          query:
            source_dir: Software
            extensions:
              - UEF
            transform_zip: true
            supports_zaparoo: true
            zip_mode: flatten
      - ROMs:
          query:
            source_dir: Software
            extensions:
              - ROM
            transform_zip: true
            supports_zaparoo: true
            zip_mode: flatten
  - name: BBCMicro
    manufacturer: Acorn
    system_mapping_name: BBC Micro
    local_base_path: Acorn/BBC_B/
    maps:
      - boot.vhd:
          file:
            path: Software/MMB/higgy_mmbeeb-v1.2.zip
            unzip: true
            zip_internal_file: BEEB.MMB
      - FDs:
          query:
