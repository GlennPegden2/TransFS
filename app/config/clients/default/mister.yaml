# MiSTer FPGA Client Configuration
# Defines system mappings and file organization for MiSTer platform

name: MiSTer
download_layout: folder_based
default_target_path: "{name}/{system_name}/{maps}"

retronas_support:
  enabled: false
  transport: smb
  auto_map_system_name: true
  canonical_roots:
    roms: "Canonical/roms/{src}"
    saves: "Canonical/saves/{src}"
    savestates: "Canonical/savestates/{src}"
    bios: "Canonical/bios/{src}"
  top_levels:
    - name: games
      source_root: roms
      per_system: true
    - name: saves
      source_root: saves
      per_system: true
    - name: savestates
      source_root: savestates
      per_system: true
    - name: BIOS
      source_root: bios
      per_system: true
  overrides:
    - top_level: games
      client_name: PSX
      src: sony/playstation1
    - top_level: saves
      client_name: PSX
      src: sony/playstation1
    - top_level: savestates
      client_name: PSX
      src: sony/playstation1
    - top_level: BIOS
      client_name: PSX
      src: sony/playstation1
    - top_level: games
      client_name: PlayStation
      src: sony/playstation1

systems:
 # --- 3DO Company ---
  - name: 3do
    manufacturer: 3DO
    system_mapping_name: 3DO
    local_base_path: Systems/3DO/3DO
    maps:
      - boot.rom:
          file:
            path: BIOS/3do.zip
            zip_internal_file: panafz1.bin 
            unzip: true
            supports_zaparoo: false
      - cd_bios.rom:
          file:
            path: BIOS/3do.zip
            zip_internal_file: panafz1.bin 
            unzip: true
            supports_zaparoo: false
      - panafz10.bin:
          file:
            path: BIOS/3do.zip
            zip_internal_file: panafz1.bin 
            unzip: true
            supports_zaparoo: false
      - CDs:
          query:
            source_dir: Software/Collections/
            extensions:
              - CUE
              - BIN
              - CHD
              - ISO
            transform_zip: true
            zip_mode: flatten
            supports_zaparoo: true
      - BIOS:
          query:
            source_dir: BIOS
            extensions:
              - ROM
              - BIN
              - ZIP

