name: GoodTools
version: "3.27"
description: "Baseline GoodTools naming rules (starter set)"
tokens:
  flags:
    prototype: "[p]"
    homebrew: "[hb]"
    bad: "[b]"
  region:
    - "(U)"
    - "(J)"
    - "(E)"
rules:
  - id: goodtools_basic
    pattern: "{title} ({region}) [{flags}]"
    mappings:
      region: region
      flags: flags
