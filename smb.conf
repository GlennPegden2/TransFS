[global]
workgroup = WORKGROUP
security = user
map to guest = Bad User
server role = standalone server
netbios name = TRANSFS
netbios aliases = TRANSFS-HOST
disable netbios = no
smb ports = 445
interfaces = eth0
bind interfaces only = yes
log level = 2 smb:3 locking:5
log file = /mnt/filestorefs/.transfs_logs/samba.%m
debug pid = yes
smb2 leases = no
durable handles = no

[TransFS]
path = /mnt/transfs
browseable = yes
read only = no
guest ok = yes
force user = root
strict locking = no
locking = no
oplocks = no
level2 oplocks = no
kernel oplocks = no
kernel share modes = no
posix locking = no
strict sync = no
sync always = no
aio read size = 0
aio write size = 0
read raw = no
write raw = no
use sendfile = no

[FilestoreFS]
path = /mnt/filestorefs
browseable = yes
read only = no
guest ok = yes
force user = root
strict locking = no
locking = no
oplocks = no
level2 oplocks = no
kernel oplocks = no
kernel share modes = no
posix locking = no
strict sync = no
sync always = no
aio read size = 0
aio write size = 0
read raw = no
write raw = no
use sendfile = no