[global]
workgroup = WORKGROUP
security = user
map to guest = Never
username map = /etc/samba/smbusers
server role = standalone server
netbios name = TRANSFS
netbios aliases = TRANSFS-HOST
disable netbios = no
smb ports = 445
interfaces = eth0
bind interfaces only = yes
log level = 2 smb:3 locking:5
log file = /mnt/filestorefs/.transfs_logs/samba.%m
debug pid = yes
smb2 leases = no
durable handles = no
min receivefile size = 0
max open files = 16384
max smbd processes = 0
server min protocol = SMB2
server max protocol = SMB3
server signing = disabled
client signing = disabled
smb encrypt = disabled
read raw = yes
write raw = yes
use sendfile = yes

[TransFS]
path = /mnt/transfs
browseable = yes
read only = no
valid users = root
force user = root
strict locking = no
locking = no
oplocks = no
level2 oplocks = no
kernel oplocks = no
kernel share modes = no
posix locking = no
strict sync = yes
sync always = yes
aio read size = 0
aio write size = 0
read raw = yes
write raw = yes
use sendfile = yes
# FUSE filesystem compatibility settings
delete veto files = yes
veto files = /.snapshot/