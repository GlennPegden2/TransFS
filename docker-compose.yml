
services:
  postgres:
    image: postgres:15-alpine
    container_name: transfs-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: transfs
      POSTGRES_USER: transfs
      POSTGRES_PASSWORD: transfs_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfs"]
      interval: 5s
      timeout: 5s
      retries: 5

  transfs:
    build: .
    container_name: transfs
    hostname: transfs
    image: transfs-image
    extra_hosts:
      - "transfs-host:host-gateway"  # Maps to Docker host's IP
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    ports:
      - "3445:445"
      - "4139:139"
      - "137:137/udp"  # NetBIOS Name Service
      - "138:138/udp"  # NetBIOS Datagram Service
      - "5678:5678"  # Expose debug port
      - "8000:8000"  # Expose FastAPI web service (change to match transfs.yaml web_api.port if modified)
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./content:/mnt/filestorefs   # Mount point on the host
      - ./app:/app                      # Mount project root for code and static/templates
      - ./tests:/tests                      # Not needed in production, but useful for testing
      - ./tests:/app/tests                  # Make tests visible under /app for pytest
      # - ./transfs:/mnt/transfs # COMMENTED OUT: This prevents FUSE from mounting. Only uncomment for specific unit testing needs

    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AVAHI_HOSTNAME=transfs.local  
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - TRANSFS_PERSIST_ZIP_INDEX=1  # Enable ZIP index caching for better performance
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transfs
      - DB_USER=transfs
      - DB_PASSWORD=transfs_pass
      - SMB_ADVERTISE_HOST=${SMB_ADVERTISE_HOST:-192.168.95.36}
      - SMB_ADVERTISE_PORT=${SMB_ADVERTISE_PORT:-3445}
      - SMB_ADVERTISE_SHARE=${SMB_ADVERTISE_SHARE:-TransFS}
      # - DEBUG_MODE=1  # Commented out to allow FUSE to start. Uncomment only when debugging with debugpy
    entrypoint: >
      bash -c "
        mkdir -p /mnt/filestorefs &&
        mkdir -p /mnt/filestorefs/.transfs_logs &&
        python3 -c \"import sys; sys.path.insert(0, '/app'); from smb_config import setup_samba_from_config; import yaml; config = yaml.safe_load(open('/app/config/app.yaml')); setup_samba_from_config(config)\" &&
        echo 'Starting FUSE filesystem...' &&
        if [ \"$$DEBUG_MODE\" = \"1\" ]; then
          echo 'Starting in debug mode...';
          python3 -m debugpy --listen 0.0.0.0:5678 --wait-for-client /app/transfs.py 2>&1 | tee -a /mnt/filestorefs/.transfs_logs/transfs.log &
        else 
          echo 'Starting in normal mode...';
          python3 -m transfs 2>&1 | tee -a /mnt/filestorefs/.transfs_logs/transfs.log &
        fi &&
        echo 'Waiting for FUSE mount...' &&
        for i in {1..30}; do
          if mountpoint -q /mnt/transfs; then
            echo 'FUSE mount ready';
            break;
          fi;
          sleep 1;
        done &&
        if ! mountpoint -q /mnt/transfs; then
          echo 'ERROR: FUSE failed to mount after 30 seconds';
          exit 1;
        fi &&
        echo 'Starting SMB services...' &&
        service smbd start &&
        service nmbd start &&
        WEB_PORT=\$$(python3 -c \"import yaml; print(yaml.safe_load(open('/app/transfs.yaml'))['web_api']['port'])\" 2>/dev/null || echo \"8000\") &&
        WEB_HOST=\$$(python3 -c \"import yaml; print(yaml.safe_load(open('/app/transfs.yaml'))['web_api']['host'])\" 2>/dev/null || echo \"0.0.0.0\") &&
        echo \"Starting FastAPI web service on $${WEB_HOST}:$${WEB_PORT}...\" &&
        uvicorn main:app --host \"$${WEB_HOST}\" --port \"$${WEB_PORT}\" --reload 2>&1 | tee -a /mnt/filestorefs/.transfs_logs/web.log &&
        tail -f /dev/null
      "

volumes:
  postgres_data: