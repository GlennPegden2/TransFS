services:
  postgres:
    profiles:
      - operational
      - development
      - retronas-testbed
    image: postgres:15-alpine
    container_name: transfs-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: transfs
      POSTGRES_USER: transfs
      POSTGRES_PASSWORD: transfs_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfs"]
      interval: 5s
      timeout: 5s
      retries: 5

  transfs:
    profiles:
      - operational
      - development
    build: .
    container_name: transfs
    hostname: transfs
    image: transfs-image
    extra_hosts:
      - "transfs-host:host-gateway"  # Maps to Docker host's IP
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    ports:
      - "3445:445"
      - "4139:139"
      - "137:137/udp"  # NetBIOS Name Service
      - "138:138/udp"  # NetBIOS Datagram Service
      - "5678:5678"  # Expose debug port
      - "8000:8000"  # Expose FastAPI web service (change to match transfs.yaml web_api.port if modified)
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./content:/mnt/filestorefs   # Mount point on the host
      - ./app:/app                      # Mount project root for code and static/templates
      - ./tests:/tests                      # Not needed in production, but useful for testing
      - ./tests:/app/tests                  # Make tests visible under /app for pytest
      # - ./transfs:/mnt/transfs # COMMENTED OUT: This prevents FUSE from mounting. Only uncomment for specific unit testing needs

    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AVAHI_HOSTNAME=transfs.local
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - TRANSFS_PERSIST_ZIP_INDEX=1  # Enable ZIP index caching for better performance
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transfs
      - DB_USER=transfs
      - DB_PASSWORD=transfs_pass
      - SMB_ADVERTISE_HOST=${SMB_ADVERTISE_HOST:-192.168.95.36}
      - SMB_ADVERTISE_PORT=${SMB_ADVERTISE_PORT:-3445}
      - SMB_ADVERTISE_SHARE=${SMB_ADVERTISE_SHARE:-TransFS}
      # - DEBUG_MODE=1  # Commented out to allow FUSE to start. Uncomment only when debugging with debugpy
    entrypoint: ["/entrypoint.sh"]

  retronas-testbed-runtime:
    build:
      context: .
      dockerfile: Dockerfile.retronas-testbed
    image: retronas:testbed
    container_name: retronas-testbed
    profiles:
      - retronas-testbed
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
      - SETPCAP
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=transfs
      - DB_USER=transfs
      - DB_PASSWORD=transfs_pass
      - MY_IPS=127.0.0.1
    ports:
      - "3445:445"      # SMB (maps to host 3445 to avoid conflict with host Samba)
      - "4139:139"      # NetBIOS session
      - "137:137/udp"   # NetBIOS name service
      - "138:138/udp"   # NetBIOS datagram
      - "8000:8000"     # TransFS web API
    command: ["/opt/transfs/platform/retronas/start_transfs_retronas.sh"]
    volumes:
      - ./app:/opt/transfs/app
      - ./tests:/opt/transfs/tests
      - ./tools:/opt/transfs/tools
      - ./requirements.txt:/opt/transfs/requirements.txt:ro

volumes:
  postgres_data:
